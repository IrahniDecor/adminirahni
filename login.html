<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irahni Decors — Admin Portal Login</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="icon" type="image/png" href="../logo.png">
</head>
<body>
  
  <div class="auth-overlay">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="../logo.png" alt="Logo" width="48" height="48">
        <h2>Portal Sign In</h2>
        <p>Enter credentials to access the dashboard.</p>
      </div>
      
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter admin email" required autocomplete="email">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
        
        <p id="login-error" class="error-msg" hidden>Invalid email or password.</p>
        
        <button type="submit" id="btn-login-submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
    </div>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
